[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-maxcut-study"
version = "0.1.0"
description = "Reproducible QAOA Max-Cut experiments with classical baselines and noise"
requires-python = ">=3.12,<3.14"
dependencies = [
  "qiskit==2.2.3",
  "qiskit-aer==0.17.2",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "networkx==3.5",
  "matplotlib==3.10.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
hardware = ["qiskit-ibm-runtime==0.43.1"]
figures = ["pylatexenc==2.10"]

[project.scripts]
qaoa-study = "qaoa_maxcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
